name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/AGC.Tests --locked-mode
      - run: dotnet run --project tests/AGC.Tests -c Release --no-restore -- --windows
      - name: Verificar colagem e pontuação em um editor real
        run: dotnet run --project tests/AGC.Tests -c Release --no-build -- --desktop-paste
        timeout-minutes: 2
      - run: ./tools/package.ps1
        shell: pwsh
      - name: Testar instalação, atualização e desinstalação
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem artifacts -Filter 'AGC-Setup-*-win-x64.exe')
          if ($setup.Count -ne 1) { throw 'Esperado um instalador.' }
          ./tools/test-installer.ps1 -Setup $setup[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/AGC-Setup-*-win-x64.exe

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: package
      - name: Publicar pacote testado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem package -Filter 'AGC-Setup-*-win-x64.exe'
          if (@($setup).Count -ne 1) { throw 'Esperado exatamente um instalador Windows.' }
          $hash = (Get-FileHash $setup.FullName).Hash.ToLowerInvariant()
          $notes = @(
            'Baixe e execute o instalador .exe para Windows x64. Ele cria o atalho no menu Iniciar e inclui o runtime, o dicionário pt-BR e as licenças. Nenhum download adicional é necessário.'
            ''
            'Se estiver usando uma versão anterior, escolha Sair do AGC na bandeja antes de instalar. As preferências locais são mantidas.'
            ''
            "SHA-256 do instalador: $hash"
          )
          $notes | Set-Content -Encoding utf8 release-notes.md
          gh release create $env:GITHUB_REF_NAME $setup.FullName --repo $env:GITHUB_REPOSITORY --verify-tag --title "automatic grammar correction $env:GITHUB_REF_NAME" --notes-file release-notes.md

