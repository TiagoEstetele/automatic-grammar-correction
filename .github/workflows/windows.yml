name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/AGC.Tests --locked-mode
      - run: dotnet run --project tests/AGC.Tests -c Release --no-restore -- --windows
      - run: ./tools/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: package
      - name: Publicar pacote testado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem package -Filter '*.zip'
          if (@($zip).Count -ne 1) { throw 'Esperado exatamente um pacote Windows.' }
          $hash = (Get-FileHash $zip.FullName).Hash.ToLowerInvariant()
          $notes = @(
            'Extraia o ZIP completo e execute AutomaticGrammarCorrection.exe. O pacote para Windows x64 inclui o runtime, o dicionário pt-BR e as licenças.'
            ''
            'A revisão por palavra começa no espaço ou na pontuação. Selecione um trecho para abrir o pop-up de ortografia, gramática e pontuação. No Codex, o AGC mostra sugestões e preserva o rascunho. O novo painel abre com dois cliques no ícone da bandeja.'
            ''
            "SHA-256 do ZIP: $hash"
          )
          $notes | Set-Content -Encoding utf8 release-notes.md
          gh release create $env:GITHUB_REF_NAME $zip.FullName --repo $env:GITHUB_REPOSITORY --verify-tag --title "automatic grammar correction $env:GITHUB_REF_NAME" --notes-file release-notes.md

